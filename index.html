
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog</title>
<style>
  header {
    background-color: #EEA2AD;
    color: #1C1C1C;
    text-align: center;
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
  }

  main {
    background-color: #FFB6C1;
    color: #1C1C1C;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  img {
    width: 300px;
    height: 300px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .conteudo-texto {
    text-align: left;
  }

  .botoes-container {
    margin-top: 16px;
  }

  button {
    cursor: pointer;
    padding: 8px 12px;
    font-size: 16px;
  }
</style>
</head>
<body>
  <header>
    <h1>Minha página sobre o grupo sul-coreano - NEWJEANS</h1>
    <p>Aqui vou compartilhar seu trabalho, curiosidades e divulgação sobre elas.</p>
  </header>
  
  <main>
    <img src="newjeans.png" alt="Logo em estética Y2K com o nome New Jeans em letras arredondadas rosa e azul dentro de uma bolha holográfica, sobre um fundo rosa claro">
    
    <div class="conteudo-texto">
      <h2>Meu primeiro post</h2>
      <p>Por Yasmin Rafaelle</p>
      <p>Boas-vindas ao meu novo blog! Aqui irei compartilhar o trabalho do grupo sul-coreano NEWJEANS.</p>
      
      <div class="botoes-container">
        <button type="button">❤️ <span>0</span></button>  
        <button type="button">⭐ <span>0</span></button>   
      </div>
    </div>
  </main>

  <script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
      botao.addEventListener("click", function () {
        let spanTexto = botao.querySelector("span");
        let valorAtual = parseInt(spanTexto.textContent);

        // Soma +1 a cada clique sem restrições
        spanTexto.textContent = valorAtual + 1;
      });
    });
  </script>
</body>
</html>
